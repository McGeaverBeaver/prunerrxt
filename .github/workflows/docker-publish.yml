name: Build and Push Docker Image

# Builds ghcr.io/<owner>/prunerrxt for amd64 and arm64 and publishes it under
# the tags it is given. Three ways in:
#
# - Called by release.yml on every push to main (workflow_call) with the
#   version and the tags :latest, :X.Y.Z, :X.Y and :X.
# - A push to the beta branch publishes :beta, with the version "beta-<sha>".
# - Run workflow by hand: a tag typed into the input is published as is; left
#   empty, the branch name is the tag (e.g. :main), with "<branch>-<sha>" as
#   the version so the UI never claims to be a release.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build'
        required: true
        type: string
      version:
        description: 'APP_VERSION baked into the image'
        required: true
        type: string
      tags:
        description: 'Image tags to publish, one per line'
        required: true
        type: string
  push:
    branches:
      - beta
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag to publish. Leave empty to publish the branch name.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      meta_tags: ${{ steps.plan.outputs.meta_tags }}
      first_tag: ${{ steps.plan.outputs.first_tag }}
    steps:
      - name: Decide what to build
        id: plan
        env:
          CALL_REF: ${{ inputs.ref }}
          CALL_VERSION: ${{ inputs.version }}
          CALL_TAGS: ${{ inputs.tags }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ] || [ -n "$CALL_VERSION" ]; then
            REF="$CALL_REF"
            VERSION="$CALL_VERSION"
            TAGS="$CALL_TAGS"
          elif [ -n "$DISPATCH_TAG" ]; then
            REF="$GITHUB_SHA"
            VERSION="${DISPATCH_TAG#v}"
            TAGS="$DISPATCH_TAG"
          else
            REF="$GITHUB_SHA"
            VERSION="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
            TAGS="$GITHUB_REF_NAME"
          fi
          META=""
          FIRST=""
          while IFS= read -r t; do
            t="$(echo "$t" | xargs)"
            [ -z "$t" ] && continue
            META="${META}type=raw,value=${t}"$'\n'
            [ -z "$FIRST" ] && FIRST="$t"
          done <<< "$TAGS"
          {
            echo "ref=$REF"
            echo "version=$VERSION"
            echo "first_tag=$FIRST"
            echo "meta_tags<<EOF"
            printf '%s' "$META"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building $REF as version $VERSION with tags: $(echo "$TAGS" | xargs)"

  # Build each platform natively in parallel
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          # GHCR image names must be lowercase; the owner login may not be.
          echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/prunerrxt" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge platform images into a single multi-arch manifest
  merge:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare
        run: |
          echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/prunerrxt" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: ${{ needs.prepare.outputs.meta_tags }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.first_tag }}
