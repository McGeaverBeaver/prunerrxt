# Version updates for the two things the lockfile alerts cannot see: the Node
# base image in the Dockerfile and the pinned GitHub Actions the workflows use.
# npm packages are deliberately left out; those are updated in deliberate
# rounds with the full lint, test and screenshot pass, and Dependabot alerts
# cover their advisories without this file.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    # Node majors are chosen by hand (LTS only): Dependabot proposes the
    # newest release, which is a Current line for half the year.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
