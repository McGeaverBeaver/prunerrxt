<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#050812"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.88" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2740"/>
      <stop offset="1" stop-color="#090e1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <text x="80" y="150" font-family="Space Grotesk, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="64" letter-spacing="-2.4"><tspan fill="#f8fafc">Prunerr</tspan><tspan fill="#f59e0b">XT</tspan></text>

  <text x="80" y="268" font-family="Space Grotesk, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="56" letter-spacing="-2" fill="#ffffff">Prune what nobody watches.</text>
  <text x="80" y="340" font-family="Space Grotesk, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="56" letter-spacing="-2" fill="#ffffff">Keep what you can't get back.</text>

  <text x="82" y="402" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">Media library cleanup for Plex, Jellyfin and Emby through Sonarr and Radarr,</text>
  <text x="82" y="434" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">with Archive, Insights, a tamper-evident audit log and an AI connector.</text>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="15" fill="#cbd5e1">
    <rect x="80" y="476" width="92" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="126" y="498" text-anchor="middle">Archive</text>
    <rect x="182" y="476" width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="230" y="498" text-anchor="middle">Insights</text>
    <rect x="288" y="476" width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="342" y="498" text-anchor="middle">Audit log</text>
    <rect x="406" y="476" width="136" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="474" y="498" text-anchor="middle">AI assistant</text>
    <rect x="552" y="476" width="88" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="596" y="498" text-anchor="middle">SSO</text>
  </g>

  <text x="82" y="566" font-family="JetBrains Mono, 'Courier New', monospace" font-weight="500" font-size="18" fill="#fcd34d" letter-spacing="0.5">github.com/McGeaverBeaver/prunerrxt</text>

  <g transform="translate(884 187) scale(1)">
    <rect width="256" height="256" rx="56" fill="url(#tile)"/>
    <rect width="256" height="256" rx="56" fill="url(#glow)"/>
    <rect x="3" y="3" width="250" height="250" rx="53" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    <g stroke="#2dd4bf" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M128 104 V40"/>
      <path d="M128 76 C119 70 110 70 100 58"/>
      <path d="M128 60 C137 52 146 52 156 40"/>
    </g>
    <g stroke="url(#amber)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M128 128 L66 46" stroke-width="24"/>
      <path d="M128 128 L190 46" stroke-width="24"/>
      <path d="M128 128 L106 170" stroke-width="20"/>
      <path d="M128 128 L150 170" stroke-width="20"/>
      <circle cx="90" cy="196" r="26" stroke-width="16"/>
      <circle cx="166" cy="196" r="26" stroke-width="16"/>
    </g>
    <circle cx="128" cy="128" r="9" fill="#090e1a"/>
  </g>
